name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Root directory of the built static site
          local-dir: ./out/
          # Target folder on Hostinger for gibbypaul.com (addon domain).
          # Override with the FTP_SERVER_DIR secret if your FTP account is
          # already scoped to the domain (then use "./public_html/").
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/domains/gibbypaul.com/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
